<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
  <title>Clinic Virtual Assistant | NexloAI Demo</title>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    :root {
      --primary: #0a6bc1;
      --accent: #0d9ea8;
      --navy: #0b2a55;
      --muted: #8fa3bd
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent }
    html, body { height: 100% }
    body {
      margin: 0;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Segoe UI', system-ui, -apple-system, 'Noto Sans Arabic', sans-serif;
      color: var(--navy);
      background: linear-gradient(180deg, #eaf3fb, #6e7072)
    }

    #box {
      width: 100%;
      max-width: 500px;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background: linear-gradient(180deg, #f7fbff, #eef5fb);
      box-shadow: 0 15px 40px rgba(13, 75, 138, .15);
    }

    /* HEADER */
    header {
      position: relative;
      padding: 14px 18px 36px;
      color: #fff;
      overflow: hidden;
      flex-shrink: 0;
      background: linear-gradient(120deg, #0a3f7e 0%, #0d57a0 55%, #2d8fd0 100%)
    }

    header::before {
      content: "";
      position: absolute;
      inset: 0;
      background: url('https://images.unsplash.com/photo-1629909613654-28e377c37b09?q=80&w=900&auto=format&fit=crop') right center/cover;
      -webkit-mask-image: linear-gradient(90deg, transparent 30%, #000 80%);
      mask-image: linear-gradient(90deg, transparent 30%, #000 80%);
      opacity: .75
    }

    .header-top { display: flex; align-items: center; gap: 10px; position: relative; z-index: 1 }

    .logo-circle {
      width: 48px; height: 48px; border-radius: 50%; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      font-weight: 800; font-size: 18px; color: #fff; letter-spacing: -0.5px;
      background: radial-gradient(circle at 30% 25%, #35b0ff, #0a62b5 70%);
      border: 2px solid rgba(120, 200, 255, .6);
      box-shadow: 0 4px 10px rgba(0, 0, 0, .2), inset 0 0 8px rgba(255, 255, 255, .2)
    }

    .title-area { flex: 1; min-width: 0 }
    .title-area h1 { margin: 0; font-size: 17px; font-weight: 700; line-height: 1.15; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .title-area p { margin: 3px 0 0; font-size: 11px; letter-spacing: 0.5px; opacity: .9 }

    .header-icon {
      width: 34px; height: 34px; border-radius: 8px; display: flex; align-items: center; justify-content: center;
      cursor: pointer; background: rgba(20, 80, 150, .75); border: 1px solid rgba(255, 255, 255, .2); transition: background .2s
    }
    .header-icon:hover { background: rgba(20, 80, 150, 1) }
    .header-icon svg { width: 16px; height: 16px; fill: #fff }

    .status-bar {
      display: flex; align-items: center; gap: 6px; margin-top: 10px;
      font-size: 11px; font-weight: 500; position: relative; z-index: 1; flex-wrap: wrap
    }
    .status-dot { width: 8px; height: 8px; border-radius: 50%; background: #19d58a; box-shadow: 0 0 6px #19d58a }
    .divider { width: 1px; height: 10px; background: rgba(255, 255, 255, .55) }

    /* CHAT PANEL */
    .panel {
      flex: 1; min-height: 0; display: flex; flex-direction: column;
      margin-top: -20px; position: relative; z-index: 2;
      background: linear-gradient(180deg, #fdfeff, #f1f7fc); border-radius: 20px 20px 0 0
    }

    #msgs { flex: 1; overflow-y: auto; padding: 16px 14px 8px; display: flex; flex-direction: column; gap: 14px; }
    #msgs::-webkit-scrollbar { width: 4px }
    #msgs::-webkit-scrollbar-thumb { background: #cfdbe8; border-radius: 10px }

    .msg-row { display: flex; gap: 10px; align-items: flex-start; max-width: 92% }
    .msg-row.user { align-self: flex-end; flex-direction: row-reverse }

    .msg-avatar {
      width: 32px; height: 32px; border-radius: 50%; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      font-weight: 700; font-size: 12px; color: #fff
    }
    .msg-row.bot .msg-avatar { background: radial-gradient(circle at 30% 25%, #2fb4c9, #0a62b5 75%); border: 2px solid rgba(255, 255, 255, .8); box-shadow: 0 2px 6px rgba(10, 98, 181, .25) }
    .msg-row.user .msg-avatar { background: linear-gradient(135deg, #1aa9d6, #0a6bc1); box-shadow: 0 2px 6px rgba(10, 107, 193, .25) }

    .msg-content { display: flex; flex-direction: column; min-width: 0 }
    .msg-row.user .msg-content { align-items: flex-end }

    .bubble { padding: 10px 14px; border-radius: 18px; font-size: 13.5px; line-height: 1.45; word-break: break-word; }
    .msg-row.bot .bubble { background: #fff; color: var(--navy); border-top-left-radius: 6px; box-shadow: 0 2px 10px rgba(30, 100, 170, .06) }
    .msg-row.user .bubble { background: linear-gradient(120deg, #0d9ea8, #17b4c8); color: #fff; border-bottom-right-radius: 6px; box-shadow: 0 4px 12px rgba(13, 158, 168, .2) }

    .bubble p { margin: 0 0 6px }
    .bubble p:last-child { margin-bottom: 0 }
    .bubble ul, .bubble ol { margin: 4px 0 6px; padding-inline-start: 16px }
    .bubble li { margin-bottom: 2px }
    .msg-row.bot .bubble strong { color: var(--primary) }
    .msg-meta { font-size: 10px; color: var(--muted); margin-top: 4px; padding: 0 2px; display: flex; align-items: center; gap: 4px }
    .ticks { color: #1a6fe0; display: flex }
    .ticks svg { width: 14px; height: 14px; fill: currentColor }

    .typing { display: flex; gap: 4px; align-items: center; padding: 14px 14px }
    .typing span { width: 5px; height: 5px; background: #b9c9da; border-radius: 50%; animation: bounce 1.4s infinite ease-in-out both }
    .typing span:nth-child(1) { animation-delay: -.32s }
    .typing span:nth-child(2) { animation-delay: -.16s }
    @keyframes bounce {
      0%, 80%, 100% { transform: scale(0) }
      40% { transform: scale(1) }
    }

    /* CHIPS - Premium Style */
    .chips { display: flex; flex-wrap: wrap; gap: 8px; padding: 4px 14px 10px; }
    .chip {
      display: flex; align-items: center; justify-content: center;
      padding: 8px 14px; border-radius: 20px;
      background: #fff; border: 1px solid #dbe8f4;
      color: var(--navy); font-size: 12.5px; font-weight: 600;
      cursor: pointer; box-shadow: 0 2px 6px rgba(30, 100, 170, .04);
      transition: all .2s;
    }
    .chip:hover { transform: translateY(-1px); box-shadow: 0 4px 10px rgba(13, 158, 168, .15); border-color: var(--accent); color: var(--accent); }

    /* INPUT */
    .input-area { margin: 0 14px 14px; padding: 10px 12px; background: #fff; border-radius: 20px; box-shadow: 0 4px 20px rgba(30, 100, 170, .06) }
    form { display: flex; align-items: center; gap: 8px; margin: 0 }
    .input-wrap { flex: 1; min-width: 0; background: #fff; border: 1.5px solid #d3e2f1; border-radius: 24px; display: flex; align-items: center; padding: 0 14px; transition: all .2s }
    .input-wrap:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(13, 158, 168, .1) }
    input { width: 100%; padding: 10px 0; border: 0; background: transparent; outline: 0; font-size: 13px; color: var(--navy); font-family: inherit }
    input::placeholder { color: #9db0c6 }

    button.send {
      width: 42px; height: 42px; flex-shrink: 0; border: 0; border-radius: 50%; cursor: pointer; color: #fff;
      display: flex; align-items: center; justify-content: center;
      background: linear-gradient(135deg, #1a7be8, #0a47b8);
      box-shadow: 0 4px 10px rgba(10, 71, 184, .25); transition: transform .15s
    }
    button.send:active { transform: scale(.94) }
    button.send:disabled { opacity: .5; cursor: not-allowed }
    button.send svg { width: 18px; height: 18px; fill: currentColor; margin-left: 2px; }

    .footer-brand { display: flex; align-items: center; justify-content: center; gap: 8px; margin-top: 8px; font-size: 10px; color: #8fa3bd }
    .footer-brand .line { height: 1px; width: 30px; background: linear-gradient(90deg, transparent, #1a7be8) }
    .footer-brand .line:last-child { background: linear-gradient(90deg, #1a7be8, transparent) }
    .footer-brand b { color: #0a47b8; font-size: 13px; display: flex; align-items: center; gap: 2px }
    .footer-brand b i { font-style: normal; color: #19c3d8; font-size: 12px; }

    @media(max-width:430px) { .title-area h1 { font-size: 16px } }
    @media(min-width:700px) { body { padding: 20px } #box { height: min(750px, calc(100dvh - 40px)); border-radius: 20px } }
  </style>
</head>

<body>
  <div id="box">
    <header>
      <div class="header-top">
        <div class="logo-circle" id="clinicLogo">--</div>
        <div class="title-area">
          <h1 id="clinicName">Loading...</h1>
          <p id="subtitle">Healthcare Clinic</p>
        </div>
        <div class="header-icon" onclick="location.reload()" title="Restart">
          <svg viewBox="0 0 24 24"><path d="M17.65 6.35C16.2 4.9 14.21 4 12 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08c-.82 2.33-3.04 4-5.65 4-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/></svg>
        </div>
      </div>
      <div class="status-bar">
        <span class="status-dot"></span><span>Online</span>
        <span class="divider"></span><span>Virtual Assistant</span>
        <span class="divider"></span><span dir="rtl">المساعد الافتراضي</span>
      </div>
    </header>

    <div class="panel">
      <div id="msgs" aria-live="polite"></div>
      <div class="chips" id="chips"></div>
      <div class="input-area">
        <form id="f">
          <div class="input-wrap">
            <input id="i" placeholder="Type your message... /  اكتب رسالتك" autocomplete="off" maxlength="4000" aria-label="Your message">
          </div>
          <button class="send" id="s" type="submit" aria-label="Send">
            <svg viewBox="0 0 24 24"><path d="M2.010 21L23 12 2.010 3 2 10l15 2-15 2z" /></svg>
          </button>
        </form>
        <div class="footer-brand">
          <span class="line"></span>Powered by <b><i>✦</i> Nexlo AI</b><span class="line"></span>
        </div>
      </div>
    </div>
  </div>

  <script>
  const slug = location.pathname.startsWith('/demo/') ? location.pathname.split('/')[2] : 'zia-medical-center';
  const sid = (crypto.randomUUID ? crypto.randomUUID() : Math.random().toString(36).slice(2) + Date.now().toString(36));
  const msgs = document.getElementById('msgs');
  const f = document.getElementById('f'), i = document.getElementById('i'), s = document.getElementById('s');
  let clinic = null, typingIndicator = null;
  let clinicInitials = 'AI';

  const USER_SVG = '<svg viewBox="0 0 24 24"><path d="M12 12a4.500 4.500 0 1 0 0-9 4.500 4.500 0 0 0 0 9zm0 2c-4 0-8 2-8 5v2h16v-2c0-3-4-5-8-5z"/></svg>';
  const TICKS = '<span class="ticks"><svg viewBox="0 0 24 24"><path d="M18 7l-1.410-1.410-6.340 6.340 1.410 1.410L18 7zm4.240-1.410L11.660 16.170 7.480 12l-1.410 1.410L11.660 19l12-12-1.420-1.410zM.41 13.410L6 19l1.410-1.410L1.830 12 .41 13.410z"/></svg>';

  function getTime() { return new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }); }

  function getInitials(name) {
    if (!name) return 'AI';
    const cleaned = name.replace(/^(dr\.?|doctor|clinic|polyclinic|center|centre|hospital|medical)\s+/gi, '').trim();
    const words = cleaned.split(/\s+/).filter(Boolean);
    if (words.length === 0) return 'AI';
    if (words.length === 1) return words[0].slice(0, 2).toUpperCase();
    return (words[0][0] + words[1][0]).toUpperCase();
  }

  function add(text, cls) {
    const row = document.createElement('div');
    row.className = 'msg-row ' + (cls === 'b' ? 'bot' : 'user');
    const av = document.createElement('div');
    av.className = 'msg-avatar';
    if (cls === 'b') av.textContent = clinicInitials;
    else av.innerHTML = USER_SVG;
    const wrap = document.createElement('div');
    wrap.className = 'msg-content';
    const bubble = document.createElement('div');
    bubble.className = 'bubble';
    bubble.dir = 'auto';
    if (cls === 'b') bubble.innerHTML = (typeof marked !== 'undefined') ? marked.parse(text) : text;
    else bubble.textContent = text;
    const meta = document.createElement('div');
    meta.className = 'msg-meta';
    meta.innerHTML = '<span>' + getTime() + '</span>' + (cls === 'u' ? TICKS : '');
    wrap.appendChild(bubble); wrap.appendChild(meta);
    row.appendChild(av); row.appendChild(wrap);
    msgs.appendChild(row);
    msgs.scrollTop = msgs.scrollHeight;
    return row;
  }

  function showTyping() {
    const row = document.createElement('div');
    row.className = 'msg-row bot';
    row.innerHTML = '<div class="msg-avatar">' + clinicInitials + '</div><div class="bubble typing"><span></span><span></span><span></span></div>';
    msgs.appendChild(row);
    msgs.scrollTop = msgs.scrollHeight;
    typingIndicator = row;
  }
  function hideTyping() { if (typingIndicator) { typingIndicator.remove(); typingIndicator = null; } }

  function hideChips() {
    const c = document.getElementById('chips');
    if (c) c.innerHTML = '';
  }

  window.sendChip = function (text) {
    i.value = text;
    f.dispatchEvent(new Event('submit', { cancelable: true }));
  };

  async function init() {
    try {
      const r = await fetch('/api/clinic/' + encodeURIComponent(slug));
      if (!r.ok) throw new Error('unavailable');
      clinic = await r.json();

      document.title = clinic.name + ' | Virtual Assistant';
      document.getElementById('clinicName').textContent = clinic.name;
      if (clinic.subtitle) document.getElementById('subtitle').textContent = clinic.subtitle;

      clinicInitials = clinic.initials || clinic.logo_text || getInitials(clinic.name);
      const logoEl = document.getElementById('clinicLogo');
      if (logoEl) {
        if (clinic.logo_url) {
          logoEl.innerHTML = '<img src="' + clinic.logo_url + '" alt="' + clinic.name + '" style="width:100%;height:100%;object-fit:cover;border-radius:50%">';
        } else {
          logoEl.textContent = clinicInitials;
        }
      }

      document.documentElement.style.setProperty('--primary', clinic.primary_color || '#0a6bc1');
      document.documentElement.style.setProperty('--accent', clinic.accent_color || '#0d9ea8');

      const welcome = clinic.welcome || ("Welcome to " + clinic.name + ".<br>How can I help you today?");
      add(welcome, 'b');

      // 🔥 SMART QUICK REPLIES FETCH
      try {
        const qrRes = await fetch(`/api/clinic/${encodeURIComponent(slug)}/quick-replies`);
        const qrData = await qrRes.json();
        const chipsContainer = document.getElementById('chips');
        
        if (chipsContainer && qrData.chips) {
          qrData.chips.forEach(chipText => {
            const chip = document.createElement('div');
            chip.className = 'chip';
            chip.innerHTML = `<div>${chipText}</div>`;
            chip.onclick = () => sendChip(chipText);
            chipsContainer.appendChild(chip);
          });
        }
      } catch (err) {
        console.log("Quick replies failed to load", err);
      }

    } catch (e) {
      document.getElementById('clinicName').textContent = 'Demo unavailable';
      i.disabled = true; s.disabled = true;
      hideChips();
      add('This clinic demo is not configured yet. Please contact the NexloAI team.', 'b');
    }
  }

  f.onsubmit = async (e) => {
    e.preventDefault();
    const t = i.value.trim();
    if (!t || !clinic) return;
    hideChips();
    i.value = ''; s.disabled = true;
    add(t, 'u'); showTyping();
    try {
      const r = await fetch('/chat', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ session_id: sid, message: t, clinic_slug: slug })
      });
      const j = await r.json();
      if (!r.ok) throw new Error(j.detail || 'Request failed');
      hideTyping();
      add(j.reply || 'Sorry, could you please rephrase that?', 'b');
    } catch (err) {
      hideTyping();
      add('Sorry, the assistant is temporarily unavailable. Please try again shortly.', 'b');
    } finally {
      s.disabled = false; i.focus(); msgs.scrollTop = msgs.scrollHeight;
    }
  };

  init();
  </script>
</body>
</html>
